<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 인수인계</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans:wght@400;500;700&display=swap');
  :root{
    --bg:#f4f6fb;--surface:#fff;--surface2:#f0f2f8;--border:#dde1ee;
    --accent:#4f6ef7;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
    --text:#1a1d2e;--text2:#5c6280;--text3:#9399b2;
    --radius:14px;--radius-sm:10px;--nav-h:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Noto Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.6;padding-bottom:var(--nav-h);}

  /* Login */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(ellipse at 50% 0%,#dde5ff,var(--bg) 70%);}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(79,110,247,.1);}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .login-logo .icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .login-logo h1{font-size:18px;font-weight:700;}
  .login-box h2{font-size:22px;font-weight:700;margin-bottom:4px;}
  .login-box .sub{color:var(--text2);margin-bottom:24px;font-size:13px;}
  .fg{margin-bottom:14px;}
  .fg label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase;}
  .fi{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;}
  .fi:focus{border-color:var(--accent);background:#fff;}
  .fi option{background:#fff;color:var(--text);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;min-height:44px;transition:opacity .15s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;}
  .btn-primary:active{opacity:.85;}
  .btn-sm{padding:7px 12px;font-size:12px;min-height:34px;}
  .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border);}
  .btn-ghost:active{background:var(--surface2);}
  .btn-danger{background:rgba(220,38,38,.1);color:var(--red);border:1.5px solid rgba(220,38,38,.25);}
  .btn-success{background:rgba(22,163,74,.1);color:var(--green);border:1.5px solid rgba(22,163,74,.25);}
  .btn-edu{background:rgba(234,88,12,.1);color:var(--orange);border:1.5px solid rgba(234,88,12,.25);}
  .err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;}

  /* App */
  #app{display:none;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:6px;}
  .topbar-logo{display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .topbar-logo .icon{width:26px;height:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .topbar-logo span{font-weight:700;font-size:14px;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .user-badge{display:flex;align-items:center;gap:5px;background:var(--surface2);padding:4px 8px;border-radius:20px;font-size:11px;font-weight:500;}
  .user-badge .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
  .badge-role{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700;}
  .badge-role.admin{background:rgba(79,110,247,.15);color:var(--accent);}
  .badge-role.user{background:rgba(22,163,74,.15);color:var(--green);}
  .badge-role.trainee{background:rgba(234,88,12,.15);color:var(--orange);}
  .btn-icon{background:none;border:none;cursor:pointer;padding:4px 5px;font-size:15px;border-radius:6px;line-height:1;}
  .btn-logout{background:none;border:none;color:var(--text2);font-size:11px;font-family:inherit;cursor:pointer;padding:4px 6px;border-radius:6px;font-weight:600;}

  /* Lang selector */
  .lang-sel{display:flex;gap:4px;background:var(--surface2);border-radius:20px;padding:3px;}
  .lang-btn{border:none;background:transparent;font-size:11px;font-weight:600;cursor:pointer;padding:3px 8px;border-radius:14px;color:var(--text2);font-family:inherit;}
  .lang-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1);}

  /* Desktop tabs */
  .desk-tabs{display:none;gap:3px;}
  .tab-btn{padding:5px 12px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .tab-btn.active{background:var(--surface2);color:var(--accent);}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);height:var(--nav-h);display:flex;align-items:center;z-index:100;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:9px;font-weight:600;font-family:inherit;padding:6px 4px;min-height:44px;}
  .nav-btn .ni{font-size:19px;line-height:1;}
  .nav-btn.active{color:var(--accent);}

  /* Content */
  .main{padding:12px 12px;max-width:680px;margin:0 auto;}
  .ph{margin-bottom:12px;}
  .ph h2{font-size:16px;font-weight:700;margin-bottom:2px;}
  .ph p{color:var(--text2);font-size:12px;}

  /* Progress */
  .prog-wrap{margin-bottom:12px;}
  .prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .prog-label span{font-size:11px;color:var(--text2);}
  .prog-label strong{font-size:13px;font-weight:700;}
  .prog-track{background:var(--surface2);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .5s;}

  /* Category */
  .cat-block{margin-bottom:8px;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--surface);cursor:pointer;user-select:none;}
  .cat-hdr:active{background:var(--surface2);}
  .cat-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;}
  .cat-count{font-size:10px;color:var(--text2);background:var(--surface2);padding:2px 7px;border-radius:99px;font-weight:600;}
  .cat-type-badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700;}
  .cat-type-badge.education{background:rgba(234,88,12,.12);color:var(--orange);}
  .cat-type-badge.handover{background:rgba(79,110,247,.12);color:var(--accent);}
  .cat-chev{color:var(--text3);font-size:10px;transition:transform .2s;}
  .cat-chev.open{transform:rotate(180deg);}
  .cat-items{background:var(--surface);border-top:1px solid var(--border);}

  /* Checklist item */
  .cl-item{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;min-height:44px;}
  .cl-item:last-child{border-bottom:none;}
  .cl-item:active{background:var(--surface2);}
  .cl-item.checked{opacity:.5;}
  .chk-box{width:20px;height:20px;min-width:20px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:11px;flex-shrink:0;}
  .cl-item.checked .chk-box{background:var(--green);border-color:var(--green);color:#fff;}
  .edu-icon{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:14px;flex-shrink:0;}
  .item-con{flex:1;min-width:0;}
  .item-ttl{font-weight:500;font-size:13px;line-height:1.4;}
  .cl-item.checked .item-ttl{text-decoration:line-through;color:var(--text3);}
  .item-dsc{font-size:11px;color:var(--text2);margin-top:2px;}
  .item-nt{font-size:11px;color:var(--accent);margin-top:2px;}
  .item-mt{font-size:10px;color:var(--text3);margin-top:2px;}
  .item-arrow{color:var(--text3);font-size:12px;margin-top:2px;flex-shrink:0;}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);padding:14px 13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card-title{font-size:13px;font-weight:700;margin-bottom:11px;}
  .sec-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
  .add-form{display:flex;flex-direction:column;gap:7px;}
  .divider{border:none;border-top:1px solid var(--border);margin:12px 0;}

  /* User/item rows */
  .u-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .u-row{display:flex;align-items:center;gap:9px;background:var(--surface2);padding:9px 11px;border-radius:var(--radius-sm);}
  .u-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
  .u-info{flex:1;min-width:0;}
  .u-name{font-weight:700;font-size:12px;}
  .u-id{font-size:10px;color:var(--text2);}
  .u-row.inactive{opacity:.4;}
  .u-actions{display:flex;gap:4px;flex-shrink:0;}
  .rbadge{font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700;display:inline-block;margin-left:3px;}
  .rbadge.admin{background:rgba(79,110,247,.15);color:var(--accent);}
  .rbadge.user{background:rgba(22,163,74,.15);color:var(--green);}
  .rbadge.trainee{background:rgba(234,88,12,.15);color:var(--orange);}
  .i-list{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
  .i-row{display:flex;align-items:center;gap:8px;background:var(--surface2);padding:9px 11px;border-radius:var(--radius-sm);}
  .i-info{flex:1;min-width:0;}
  .i-name{font-size:12px;font-weight:500;}
  .i-cat{font-size:10px;color:var(--text2);margin-top:1px;}

  /* Modal */
  .modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
  .modal-ov.open{display:flex;}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px 30px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px;}
  .modal h3{font-size:15px;font-weight:700;margin-bottom:14px;}
  .modal-acts{display:flex;gap:8px;margin-top:14px;}
  .modal-acts .btn{flex:1;}

  /* Education modal */
  .edu-modal-body{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:14px;}
  .edu-img{width:100%;border-radius:10px;margin:10px 0;max-height:300px;object-fit:cover;}
  .edu-video{width:100%;aspect-ratio:16/9;border-radius:10px;margin:10px 0;border:none;}
  .lang-loading{color:var(--text3);font-size:12px;text-align:center;padding:10px;}

  /* Toast */
  #toast{position:fixed;bottom:calc(var(--nav-h)+8px);left:50%;transform:translateX(-50%) translateY(20px);background:#1a1d2e;color:#fff;border-radius:99px;padding:9px 16px;font-size:12px;font-weight:500;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:300;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:13px;}
  .empty .em{font-size:30px;margin-bottom:8px;}
  .loading{text-align:center;padding:30px 20px;color:var(--text3);}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(min-width:640px){
    body{padding-bottom:0;}
    .bottom-nav{display:none;}
    .desk-tabs{display:flex !important;}
    .topbar{height:54px;padding:0 20px;}
    .main{padding:20px 20px;}
    #toast{bottom:20px;}
    .modal-ov{align-items:center;padding:20px;}
    .modal{border-radius:18px;max-height:80vh;}
    .modal-handle{display:none;}
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><div class="icon">📋</div><div><h1>업무 인수인계</h1></div></div>
    <h2>로그인</h2>
    <p class="sub">계정 정보를 입력하여 로그인하세요</p>
    <div class="fg"><label>아이디</label><input type="text" id="inp-user" class="fi" placeholder="아이디 입력" autocomplete="username"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="inp-pass" class="fi" placeholder="비밀번호 입력" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">로그인</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><div class="icon">📋</div><span>업무 인수인계</span></div>
    <div class="desk-tabs" id="desk-tabs"></div>
    <div class="topbar-right">
      <div class="lang-sel">
        <button class="lang-btn active" onclick="setLang('ko')">한</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ne')">ने</button>
      </div>
      <div class="user-badge"><div class="av" id="uav"></div><span id="uname"></span><span class="badge-role" id="urole-badge"></span></div>
      <button class="btn-icon" onclick="registerPush()" title="알림 설정">🔔</button>
      <button class="btn-logout" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <!-- 체크리스트 탭 -->
  <div id="tab-checklist" class="main">
    <div class="ph"><h2 id="txt-checklist-title">체크리스트</h2><p id="txt-checklist-sub">항목을 눌러 완료 처리하세요</p></div>
    <div class="prog-wrap">
      <div class="prog-label"><span id="txt-progress-label">전체 진행률</span><strong id="prog-txt">0 / 0 완료</strong></div>
      <div class="prog-track"><div class="prog-fill" id="prog-bar" style="width:0%"></div></div>
    </div>
    <div id="cl-container"><div class="loading"><div class="spin"></div><br>불러오는 중...</div></div>
  </div>

  <!-- 항목 추가 탭 -->
  <div id="tab-add" class="main" style="display:none">
    <div class="ph"><h2>항목 추가</h2><p>인수인계 항목을 직접 추가하세요</p></div>
    <div class="card">
      <div class="card-title">📝 새 항목</div>
      <div class="add-form">
        <select class="fi" id="ui-cat"><option value="">카테고리 선택...</option></select>
        <input type="text" class="fi" id="ui-title" placeholder="항목 제목 *">
        <input type="text" class="fi" id="ui-desc" placeholder="설명 (선택사항)">
        <button class="btn btn-success" onclick="userAddItem()">➕ 항목 추가</button>
      </div>
      <div class="divider"></div>
      <div class="sec-lbl">새 카테고리 만들기</div>
      <div class="add-form">
        <input type="text" class="fi" id="ui-cat-title" placeholder="카테고리 이름">
        <select class="fi" id="ui-cat-type">
          <option value="handover">✅ 인수인계</option>
          <option value="education">📚 교육자료</option>
        </select>
        <button class="btn btn-ghost" onclick="userAddCategory()">+ 카테고리 추가</button>
      </div>
    </div>
  </div>

  <!-- 관리자 탭 -->
  <div id="tab-admin" class="main" style="display:none">
    <div class="ph"><h2>관리자</h2><p>사용자 및 항목을 관리합니다</p></div>
    <div class="card">
      <div class="card-title">👤 사용자 관리</div>
      <div class="u-list" id="user-list"><div class="loading"><div class="spin"></div></div></div>
      <div class="divider"></div>
      <div class="sec-lbl">새 사용자 추가</div>
      <div class="add-form">
        <input type="text" class="fi" id="new-dname" placeholder="이름 (예: 홍길동)">
        <input type="text" class="fi" id="new-uname" placeholder="아이디 (예: hong)">
        <input type="password" class="fi" id="new-pass" placeholder="비밀번호">
        <select class="fi" id="new-role">
          <option value="user">✅ 일반 직원 (인수인계+교육)</option>
          <option value="trainee">📚 신입사원 (교육자료만)</option>
          <option value="admin">⚙️ 관리자 (전체)</option>
        </select>
        <button class="btn btn-success" onclick="addUser()">+ 사용자 추가</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🗂 카테고리 관리</div>
      <div class="i-list" id="admin-cat-list"></div>
      <div class="divider"></div>
      <div class="sec-lbl">새 카테고리 추가</div>
      <div class="add-form">
        <input type="text" class="fi" id="new-cat-title" placeholder="카테고리 이름">
        <select class="fi" id="new-cat-type">
          <option value="handover">✅ 인수인계</option>
          <option value="education">📚 교육자료</option>
        </select>
        <button class="btn btn-ghost" onclick="addCategory()">+ 카테고리 추가</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📋 항목 관리</div>
      <div class="i-list" id="admin-item-list"><div class="loading"><div class="spin"></div></div></div>
      <div class="divider"></div>
      <div class="sec-lbl">새 항목 추가</div>
      <div class="add-form">
        <select class="fi" id="new-item-cat"><option value="">카테고리 선택...</option></select>
        <input type="text" class="fi" id="new-item-title" placeholder="항목 제목">
        <input type="text" class="fi" id="new-item-desc" placeholder="설명 (선택사항)">
        <div id="edu-content-fields" style="display:none;flex-direction:column;gap:7px;">
          <textarea class="fi" id="new-item-content" rows="4" placeholder="교육 내용 (텍스트)" style="resize:vertical;"></textarea>
          <input type="text" class="fi" id="new-item-image" placeholder="이미지 URL (선택사항)">
          <input type="text" class="fi" id="new-item-video" placeholder="유튜브 URL (선택사항)">
        </div>
        <button class="btn btn-success" onclick="addItem()">+ 항목 추가</button>
      </div>
    </div>
  </div>

  <!-- 하단 네비 -->
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<!-- 카테고리 수정 모달 -->
<div class="modal-ov" id="cat-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>카테고리 수정</h3>
    <div class="fg"><label>카테고리 이름</label><input type="text" id="cat-edit-inp" class="fi" placeholder="새 이름"></div>
    <div class="fg"><label>타입</label>
      <select id="cat-edit-type" class="fi">
        <option value="handover">✅ 인수인계</option>
        <option value="education">📚 교육자료</option>
      </select>
    </div>
    <div class="modal-acts">
      <button class="btn btn-ghost" onclick="closeCatModal()">취소</button>

// ── Supabase ──
async function sb(path,opts={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{headers:HDR,...opts});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||res.statusText);}
  if(res.status===204)return null;
  return res.json();
}

function h(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── 번역 ──
async function translateText(text,targetLang){
  if(targetLang==='ko')return text;
  try{
    // 캐시 확인
    const cached=await sb('translation_cache?source_text=eq.'+encodeURIComponent(text)+'&target_lang=eq.'+targetLang+'&select=translated_text');
    if(cached&&cached.length>0)return cached[0].translated_text;

    // Vercel 서버를 통한 번역
    const res=await fetch(PUSH_SERVER+'/api/translate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,targetLang})
    });
    const data=await res.json();
    if(!data.translated)return text;
    const translated=data.translated;

    // 캐시 저장
    await sb('translation_cache',{method:'POST',body:JSON.stringify({source_text:text,target_lang:targetLang,translated_text:translated})}).catch(()=>{});
    return translated;
  }catch(e){return text;}
}

async function loadChecklist(){

  }catch(e){showToast('로드 실패: '+e.message);}

function renderChecklist(){
  const con=document.getElementById('cl-container');
  const role=currentUser?.role;

  // trainee는 교육자료만, 나머지는 모두 표시
  const visibleCats=allCategories.filter(c=>role==='trainee'?c.type==='education':true);
  const handoverItems=allItems.filter(i=>{
    const cat=allCategories.find(c=>c.id===i.category_id);
    return cat&&cat.type==='handover';
  });

  const myChecks=allChecks.filter(c=>c.user_id===currentUser.id);
  const myIds=new Set(myChecks.map(c=>c.item_id));
  const total=handoverItems.length;
  const done=handoverItems.filter(i=>myIds.has(i.id)).length;

  if(role!=='trainee'){
    document.getElementById('prog-txt').textContent=done+' / '+total+' '+t('done');
    document.getElementById('prog-bar').style.width=total?Math.round(done/total*100)+'%':'0%';
  }else{
    document.getElementById('prog-wrap')&&(document.querySelector('.prog-wrap').style.display='none');
  }

  if(!visibleCats.length){
    con.innerHTML='<div class="empty"><div class="em">📋</div><p>항목을 추가하면 여기에 표시됩니다</p></div>';
    return;
  }

  let html='';
  visibleCats.forEach(function(cat){
    const items=allItems.filter(i=>i.category_id===cat.id);
    if(!items.length)return;
    const isEdu=cat.type==='education';
    const catDone=isEdu?null:items.filter(i=>myIds.has(i.id)).length;
    const catTitle=cat['title_'+currentLang]||cat.title;
    html+='<div class="cat-block">';
    html+='<div class="cat-hdr" onclick="toggleCat(\''+cat.id+'\')">';
    html+='<div class="cat-title"><span>'+h(catTitle)+'</span>';
    if(isEdu)html+='<span class="cat-type-badge education">📚 교육</span>';
    else html+='<span class="cat-count">'+catDone+'/'+items.length+'</span>';
    html+='</div>';
    html+='<span class="cat-chev open" id="chev-'+cat.id+'">▼</span></div>';
    html+='<div class="cat-items" id="ci-'+cat.id+'">';
    items.forEach(function(item){
      if(isEdu){
        const itemTitle=item['title_'+currentLang]||item.title;
        const itemDesc=item['desc_'+currentLang]||item.description;
        html+='<div class="cl-item" data-id="'+item.id+'" data-edu="1" data-title="'+h(item.title)+'">';
        html+='<div class="edu-icon">📖</div>';
        html+='<div class="item-con"><div class="item-ttl">'+h(itemTitle)+'</div>';
        if(itemDesc)html+='<div class="item-dsc">'+h(itemDesc)+'</div>';
        html+='</div><div class="item-arrow">›</div></div>';
      }else{
        const itemTitle=item['title_'+currentLang]||item.title;
        const itemDesc=item['desc_'+currentLang]||item.description;
        const myChk=myChecks.find(c=>c.item_id===item.id);
        const checked=!!myChk;
        const others=allChecks.filter(c=>c.item_id===item.id&&c.user_id!==currentUser.id);
        const othTxt=others.map(c=>c.dname).join(', ');
        html+='<div class="cl-item'+(checked?' checked':'')+'" data-id="'+item.id+'" data-title="'+h(item.title)+'">';
        html+='<div class="chk-box">'+(checked?'✓':'')+'</div>';
        html+='<div class="item-con"><div class="item-ttl">'+h(itemTitle)+'</div>';
        if(itemDesc)html+='<div class="item-dsc">'+h(itemDesc)+'</div>';
        if(myChk&&myChk.note)html+='<div class="item-nt">💬 '+h(myChk.note)+'</div>';
        if(checked)html+='<div class="item-mt">✅ 내가 완료 · '+new Date(myChk.checked_at).toLocaleDateString('ko-KR')+'</div>';
        if(othTxt)html+='<div class="item-mt" style="color:var(--accent)">👤 '+h(othTxt)+'도 완료</div>';
        html+='</div></div>';
      }
    });
    html+='</div></div>';
  });
  con.innerHTML=html||'<div class="empty"><div class="em">📋</div><p>항목이 없습니다</p></div>';

  con.onclick=function(e){
    const el=e.target.closest('.cl-item');
    if(!el)return;
    e.stopPropagation();
    const id=el.getAttribute('data-id');
    const title=el.getAttribute('data-title');
    const isEdu=el.getAttribute('data-edu')==='1';
    if(!id)return;
    if(isEdu)openEduModal(id,title);
    else clickItem(id,title);
  };
}

function toggleCat(catId){
  const el=document.getElementById('ci-'+catId);
  const chev=document.getElementById('chev-'+catId);
  const open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  chev.classList.toggle('open',!open);
}

function clickItem(itemId,itemTitle){
  const myChecks=allChecks.filter(c=>c.user_id===currentUser.id);
  if(myChecks.find(c=>c.item_id===itemId)){uncheckItem(itemId);return;}
  pendingItemId=itemId;
  document.getElementById('note-item-title').textContent=itemTitle;
  document.getElementById('note-input').value='';
  document.getElementById('note-modal').classList.add('open');
}

    await sb('handover_checks',{method:'POST',body:JSON.stringify({item_id:itemId,user_id:currentUser.id,note:note||null})});
    await loadChecklist();
    showToast('완료 처리되었습니다 ✅');
  }catch(e){showToast('저장 실패: '+e.message);}
}

async function openEduModal(itemId,itemTitle){
  const modal=document.getElementById('edu-modal');
  const titleEl=document.getElementById('edu-modal-title');
  const bodyEl=document.getElementById('edu-modal-body');

  let displayTitle=itemTitle;
  if(currentLang!=='ko'){
    displayTitle=await translateText(itemTitle,currentLang);
  }
  titleEl.textContent='📖 '+displayTitle;
  bodyEl.innerHTML='<div class="lang-loading">'+t('translating')+'</div>';
  modal.classList.add('open');

  try{
    const contents=await sb('education_contents?item_id=eq.'+itemId+'&order=order_index');
    if(!contents||contents.length===0){
      bodyEl.innerHTML='<div class="empty">등록된 교육 내용이 없습니다</div>';return;
    }

    let html='';
    for(const c of contents){
      if(c.content){
        let text=c.content;
        if(currentLang!=='ko')text=await translateText(c.content,currentLang);
        html+='<div class="edu-modal-body">'+h(text)+'</div>';
      }
      if(c.image_url){
        html+='<img class="edu-img" src="'+h(c.image_url)+'" alt="교육 이미지" onerror="this.style.display=\'none\'">';
      }

        }
      }
    }
    bodyEl.innerHTML=html;
  }catch(e){bodyEl.innerHTML='<div class="empty">로드 실패: '+e.message+'</div>';}
}

function getYoutubeId(url){
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
  return m?m[1]:null;
}

async function editEduItem(itemId){
  const item=allItems.find(i=>i.id===itemId);
  if(!item)return;
  const contents=await sb('education_contents?item_id=eq.'+itemId+'&order=order_index');
  const c=contents&&contents.length>0?contents[0]:{};
  const content=prompt('교육 내용 (텍스트):',c.content||'');
  if(content===null)return;
  const imageUrl=prompt('이미지 URL:',c.image_url||'');
  if(imageUrl===null)return;
  const videoUrl=prompt('유튜브 URL:',c.video_url||'');
  if(videoUrl===null)return;
  try{
    if(c.id){
      await sb('education_contents?id=eq.'+c.id,{method:'PATCH',body:JSON.stringify({content:content||null,image_url:imageUrl||null,video_url:videoUrl||null})});
    }else{
      await sb('education_contents',{method:'POST',body:JSON.stringify({item_id:itemId,content:content||null,image_url:imageUrl||null,video_url:videoUrl||null,order_index:1})});
    }

    await sb('translation_cache?source_text=eq.'+encodeURIComponent(content),{method:'DELETE'}).catch(()=>{});

function switchTab(tab){
  ['checklist','add','admin'].forEach(function(t2){
    const el=document.getElementById('tab-'+t2);
    if(el)el.style.display=t2===tab?'block':'none';
    const nb=document.getElementById('nav-'+t2);
    if(nb)nb.classList.toggle('active',t2===tab);
  });
  document.querySelectorAll('.desk-tabs .tab-btn').forEach(function(b){
    b.classList.toggle('active',
      (tab==='checklist'&&(b.textContent.includes('체크')||b.textContent.includes('Checklist')||b.textContent.includes('जाँच')||b.textContent.includes('교육')))
      ||(tab==='add'&&(b.textContent.includes('추가')||b.textContent.includes('Add')))
      ||(tab==='admin'&&(b.textContent.includes('관리')||b.textContent.includes('Admin')))
    );
  });
  if(tab==='admin')loadAdmin();
  if(tab==='add')loadAddTab();
}

// ── Push ──
async function registerPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){showToast('이 브라우저는 알림을 지원하지 않습니다');return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){showToast('알림 권한이 거부되었습니다');return;}
    const reg=await navigator.serviceWorker.register('/handover/sw.js');
    await navigator.serviceWorker.ready;
    const res=await fetch(PUSH_SERVER+'/api/vapid-public-key');
    const {publicKey}=await res.json();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
    await sb('push_subscriptions',{method:'POST',body:JSON.stringify({user_id:currentUser.id,subscription:sub})});
    showToast('알림이 설정되었습니다 🔔');
  }catch(e){showToast('알림 설정 실패: '+e.message);}
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=window.atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

async function sendPushToAll(title,body){
  try{await fetch(PUSH_SERVER+'/api/send-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body,excludeUserId:currentUser.id})});}
  catch(e){console.log('푸시 오류:',e);}
}

function showToast(msg){
  const t2=document.getElementById('toast');
  t2.textContent=msg;t2.classList.add('show');
  setTimeout(function(){t2.classList.remove('show');},2800);
}
