<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 인수인계</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans:wght@400;500;700&display=swap');
  :root{
    --bg:#f4f6fb;--surface:#fff;--surface2:#f0f2f8;--border:#dde1ee;
    --accent:#4f6ef7;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
    --text:#1a1d2e;--text2:#5c6280;--text3:#9399b2;
    --radius:14px;--radius-sm:10px;--nav-h:62px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Noto Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.6;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0));}

  /* Login */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(ellipse at 50% 0%,#dde5ff,var(--bg) 70%);}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(79,110,247,.1);}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .login-logo .icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .login-logo h1{font-size:18px;font-weight:700;}
  .login-box h2{font-size:22px;font-weight:700;margin-bottom:4px;}
  .login-box .sub{color:var(--text2);margin-bottom:24px;font-size:13px;}
  .fg{margin-bottom:14px;}
  .fg label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase;}
  .fi{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;}
  .fi:focus{border-color:var(--accent);background:#fff;}
  .fi option{background:#fff;color:var(--text);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;min-height:44px;transition:opacity .15s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;}
  .btn-primary:active{opacity:.85;}
  .btn-sm{padding:7px 12px;font-size:12px;min-height:34px;}
  .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border);}
  .btn-ghost:active{background:var(--surface2);}
  .btn-danger{background:rgba(220,38,38,.1);color:var(--red);border:1.5px solid rgba(220,38,38,.25);}
  .btn-success{background:rgba(22,163,74,.1);color:var(--green);border:1.5px solid rgba(22,163,74,.25);}
  .btn-edu{background:rgba(234,88,12,.1);color:var(--orange);border:1.5px solid rgba(234,88,12,.25);}
  .err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;}

  /* App */
  #app{display:none;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px;}
  .topbar-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .topbar-logo .icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .topbar-logo span{font-weight:700;font-size:15px;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  /* 모바일: 유저명 숨기고 아바타+역할만 */
  .user-badge{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:20px;}
  .user-badge .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;cursor:pointer;}
  .user-badge .uname-txt{display:none;} /* 모바일에서 이름 숨김 */
  .badge-role{font-size:9px;padding:1px 6px;border-radius:10px;font-weight:700;}
  .badge-role.admin{background:rgba(79,110,247,.15);color:var(--accent);}
  .badge-role.user{background:rgba(22,163,74,.15);color:var(--green);}
  .badge-role.trainee{background:rgba(234,88,12,.15);color:var(--orange);}
  .btn-icon{background:none;border:none;cursor:pointer;padding:6px;font-size:16px;border-radius:8px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .btn-icon:active{background:var(--surface2);}
  /* 모바일에서 로그아웃 버튼 숨김 → 아바타 길게 누르거나 메뉴에서 */
  .btn-logout{display:none;}
  /* 유저 드롭다운 메뉴 */
  .user-menu{position:absolute;top:56px;right:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:160px;overflow:hidden;z-index:200;display:none;}
  .user-menu.open{display:block;}
  .user-menu-header{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .user-menu-name{font-weight:700;font-size:13px;}
  .user-menu-role{font-size:11px;color:var(--text2);margin-top:2px;}
  .user-menu-item{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--text);}
  .user-menu-item:active{background:var(--surface2);}
  .user-menu-item.danger{color:var(--red);}

  /* Lang selector */
  .lang-sel{display:flex;gap:2px;background:var(--surface2);border-radius:20px;padding:3px;}
  .lang-btn{border:none;background:transparent;font-size:11px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:14px;color:var(--text2);font-family:inherit;min-height:28px;}
  .lang-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1);}

  /* Desktop tabs */
  .desk-tabs{display:none;gap:3px;}
  .tab-btn{padding:5px 12px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .tab-btn.active{background:var(--surface2);color:var(--accent);}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);height:var(--nav-h);display:flex;align-items:stretch;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;font-family:inherit;padding:4px 2px 6px;min-height:44px;position:relative;transition:color .15s;}
  .nav-btn .ni{font-size:22px;line-height:1;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:0 0 3px 3px;}

  /* Content */
  .main{padding:12px 12px;max-width:680px;margin:0 auto;}
  .ph{margin-bottom:12px;}
  .ph h2{font-size:16px;font-weight:700;margin-bottom:2px;}
  .ph p{color:var(--text2);font-size:12px;}

  /* Progress */
  .prog-wrap{margin-bottom:12px;}
  .prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .prog-label span{font-size:11px;color:var(--text2);}
  .prog-label strong{font-size:13px;font-weight:700;}
  .prog-track{background:var(--surface2);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .5s;}

  /* Category */
  .cat-block{margin-bottom:8px;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--surface);cursor:pointer;user-select:none;}
  .cat-hdr:active{background:var(--surface2);}
  .cat-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;}
  .cat-count{font-size:10px;color:var(--text2);background:var(--surface2);padding:2px 7px;border-radius:99px;font-weight:600;}
  .cat-type-badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700;}
  .cat-type-badge.education{background:rgba(234,88,12,.12);color:var(--orange);}
  .cat-type-badge.handover{background:rgba(79,110,247,.12);color:var(--accent);}
  .cat-chev{color:var(--text3);font-size:10px;transition:transform .2s;}
  .cat-chev.open{transform:rotate(180deg);}
  .cat-items{background:var(--surface);border-top:1px solid var(--border);}

  /* Checklist item */
  .cl-item{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;min-height:44px;}
  .cl-item:last-child{border-bottom:none;}
  .cl-item:active{background:var(--surface2);}
  .cl-item.checked{opacity:.5;}
  .chk-box{width:20px;height:20px;min-width:20px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:11px;flex-shrink:0;}
  .cl-item.checked .chk-box{background:var(--green);border-color:var(--green);color:#fff;}
  .edu-icon{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:14px;flex-shrink:0;}
  .item-con{flex:1;min-width:0;}
  .item-ttl{font-weight:500;font-size:13px;line-height:1.4;}
  .cl-item.checked .item-ttl{text-decoration:line-through;color:var(--text3);}
  .item-dsc{font-size:11px;color:var(--text2);margin-top:2px;}
  .item-nt{font-size:11px;color:var(--accent);margin-top:2px;}
  .item-mt{font-size:10px;color:var(--text3);margin-top:2px;}
  .item-arrow{color:var(--text3);font-size:12px;margin-top:2px;flex-shrink:0;}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);padding:14px 13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card-title{font-size:13px;font-weight:700;margin-bottom:11px;}
  .sec-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
  .add-form{display:flex;flex-direction:column;gap:7px;}
  .divider{border:none;border-top:1px solid var(--border);margin:12px 0;}

  /* User/item rows */
  .u-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .u-row{display:flex;align-items:center;gap:9px;background:var(--surface2);padding:9px 11px;border-radius:var(--radius-sm);}
  .u-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
  .u-info{flex:1;min-width:0;}
  .u-name{font-weight:700;font-size:12px;}
  .u-id{font-size:10px;color:var(--text2);}
  .u-row.inactive{opacity:.4;}
  .u-actions{display:flex;gap:4px;flex-shrink:0;}
  .rbadge{font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700;display:inline-block;margin-left:3px;}
  .rbadge.admin{background:rgba(79,110,247,.15);color:var(--accent);}
  .rbadge.user{background:rgba(22,163,74,.15);color:var(--green);}
  .rbadge.trainee{background:rgba(234,88,12,.15);color:var(--orange);}
  .i-list{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
  .i-row{display:flex;align-items:center;gap:8px;background:var(--surface2);padding:9px 11px;border-radius:var(--radius-sm);}
  .i-info{flex:1;min-width:0;}
  .i-name{font-size:12px;font-weight:500;}
  .i-cat{font-size:10px;color:var(--text2);margin-top:1px;}

  /* Modal */
  .modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
  .modal-ov.open{display:flex;}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px 30px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px;}
  .modal h3{font-size:15px;font-weight:700;margin-bottom:14px;}
  .modal-acts{display:flex;gap:8px;margin-top:14px;}
  .modal-acts .btn{flex:1;}

  /* Education modal */
  .edu-modal-body{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:14px;}
  .edu-img{width:100%;border-radius:10px;margin:10px 0;max-height:300px;object-fit:cover;}
  .edu-video{width:100%;aspect-ratio:16/9;border-radius:10px;margin:10px 0;border:none;}
  .lang-loading{color:var(--text3);font-size:12px;text-align:center;padding:10px;}

  /* Toast */
  #toast{position:fixed;bottom:calc(var(--nav-h)+8px);left:50%;transform:translateX(-50%) translateY(20px);background:#1a1d2e;color:#fff;border-radius:99px;padding:9px 16px;font-size:12px;font-weight:500;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:300;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:13px;}
  .empty .em{font-size:30px;margin-bottom:8px;}
  .loading{text-align:center;padding:30px 20px;color:var(--text3);}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Inventory tab */
  .inv-section{margin-bottom:14px;}
  .inv-section-hdr{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .inv-section-hdr:active{background:var(--surface2);}
  .inv-section-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;}
  .inv-section-body{background:var(--surface);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .inv-today-label{font-size:10px;font-weight:600;color:var(--accent);background:rgba(79,110,247,.07);padding:5px 13px;border-bottom:1px solid var(--border);}
  .inv-cat-hdr{background:var(--surface2);padding:6px 13px;font-size:11px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);}
  .inv-row{display:flex;align-items:flex-start;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);}
  .inv-row:last-child{border-bottom:none;}
  .inv-row-low{background:rgba(220,38,38,.03);}
  .inv-name{flex:1;min-width:0;}
  .inv-name-main{font-size:13px;font-weight:600;line-height:1.4;}
  .inv-supplier{font-size:11px;color:var(--text3);font-weight:400;}
  /* 기준 수량 표시 */
  .inv-ref-row{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);margin-top:2px;}
  .inv-ref-lbl{font-weight:700;color:var(--text3);}
  .inv-ref-val{color:var(--text2);font-weight:600;}
  .inv-ref-fri{color:var(--orange);font-weight:700;}
  .inv-ref-sep{color:var(--border);margin:0 1px;}
  /* 입력 영역 */
  .inv-inputs{display:flex;gap:8px;flex-shrink:0;align-items:flex-start;}
  .inv-input-group{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .inv-input-lbl{font-size:10px;font-weight:700;color:var(--text3);white-space:nowrap;}
  .inv-input-row{display:flex;align-items:center;gap:3px;}
  .inv-unit{font-size:10px;color:var(--text3);white-space:nowrap;}
  .inv-qty-inp{width:54px;text-align:center;padding:6px 4px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-weight:700;background:var(--surface2);color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none;}
  .inv-qty-inp:focus{border-color:var(--accent);background:#fff;outline:none;}
  .inv-qty-inp.low{border-color:var(--red);background:rgba(220,38,38,.07);}
  .inv-qty-inp.ok{border-color:var(--green);background:rgba(22,163,74,.07);}
  /* 발주 플랫폼 배지 */
  .inv-order-badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .inv-order-badge.coupang{background:rgba(234,88,12,.12);color:var(--orange);}
  .inv-order-badge.foodpang{background:rgba(79,110,247,.12);color:var(--accent);}
  .inv-order-badge.direct{background:rgba(22,163,74,.12);color:var(--green);}
  /* 필터 */
  .inv-toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .inv-filter-btn{padding:5px 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
  .inv-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  /* 발주 요약 모달 */
  .inv-summary-card{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
  .inv-summary-title{font-size:13px;font-weight:700;margin-bottom:10px;opacity:.9;}
  .inv-summary-group{margin-bottom:12px;}
  .inv-summary-group-title{font-size:11px;font-weight:700;opacity:.7;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .inv-summary-item{font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .inv-summary-item:last-child{border-bottom:none;}
  .inv-summary-empty{font-size:13px;text-align:center;padding:16px;opacity:.75;line-height:1.8;}
  .inv-summary-count{font-size:10px;opacity:.65;}
  /* 하단 고정바 */
  .inv-save-bar{position:sticky;bottom:calc(var(--nav-h) + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;gap:8px;align-items:center;z-index:50;margin:10px 0;}
  .inv-save-info{flex:1;font-size:12px;color:var(--text2);}
  .inv-save-info strong{color:var(--red);}
  @media(min-width:900px){
    .inv-save-bar{bottom:20px;}
    .inv-qty-inp{width:60px;}
  }

  @media(min-width:900px){
    body{padding-bottom:0;}
    .bottom-nav{display:none;}
    .desk-tabs{display:flex !important;}
    .topbar{height:56px;padding:0 24px;}
    .main{padding:20px 20px;}
    #toast{bottom:20px;}
    .modal-ov{align-items:center;padding:20px;}
    .modal{border-radius:18px;max-height:80vh;}
    .modal-handle{display:none;}
    .user-badge .uname-txt{display:inline;}
    .user-badge{background:var(--surface2);padding:4px 10px;}
    .btn-logout{display:inline-flex;}
    .user-menu{top:62px;}
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><div class="icon">📋</div><div><h1>업무 인수인계</h1></div></div>
    <h2>로그인</h2>
    <p class="sub">계정 정보를 입력하여 로그인하세요</p>
    <div class="fg"><label>아이디</label><input type="text" id="inp-user" class="fi" placeholder="아이디 입력" autocomplete="username"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="inp-pass" class="fi" placeholder="비밀번호 입력" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">로그인</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">

<script>
const SB_URL='https://ylppkvkmdszcidcrctsw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscHBrdmttZHN6Y2lkY3JjdHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5Njc1MjEsImV4cCI6MjA5NjU0MzUyMX0.sOoT9Git-XxRmV72GgWejZbdSVqsLMH2Qkk3XeXakYM';
const HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const PUSH_SERVER='https://handover-push-server.vercel.app';

let currentUser=null,pendingItemId=null,editingCatId=null;
let allCategories=[],allItems=[],allChecks=[];
let currentLang='ko';

// ── 다국어 UI 텍스트 ──
const UI_TEXT={
  ko:{checklist:'체크리스트',checklistSub:'항목을 눌러 완료 처리하세요',progress:'전체 진행률',done:'완료',add:'항목 추가',admin:'관리자',education:'교육자료',logout:'로그아웃',complete:'완료 처리',cancel:'취소',close:'닫기',translating:'번역 중...'},
  en:{checklist:'Checklist',checklistSub:'Tap items to mark complete',progress:'Overall Progress',done:'done',add:'Add Item',admin:'Admin',education:'Education',logout:'Logout',complete:'Mark Complete',cancel:'Cancel',close:'Close',translating:'Translating...'},
  ne:{checklist:'जाँचसूची',checklistSub:'पूरा गर्न वस्तुहरूमा ट्याप गर्नुहोस्',progress:'समग्र प्रगति',done:'पूरा',add:'वस्तु थप्नुहोस्',admin:'प्रशासक',education:'शिक्षा',logout:'लगआउट',complete:'पूरा गर्नुहोस्',cancel:'रद्द गर्नुहोस्',close:'बन्द गर्नुहोस्',translating:'अनुवाद हुँदैछ...'}
};

function t(key){return (UI_TEXT[currentLang]||UI_TEXT.ko)[key]||key;}

async function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.lang-btn').forEach(b=>{
    if((lang==='ko'&&b.textContent==='한')||(lang==='en'&&b.textContent==='EN')||(lang==='ne'&&b.textContent==='ने'))b.classList.add('active');
  });
  updateUIText();
  if(lang==='ko'){
    renderChecklist();
  }else{
    // 번역 로딩 표시
    document.getElementById('cl-container').innerHTML='<div class="loading"><div class="spin"></div><br>'+t('translating')+'</div>';
    await translateAllItems();
    renderChecklist();
  }
}

async function translateAllItems(){
  // 모든 항목 제목/설명 번역
  for(const item of allItems){
    if(item.title){
      item['title_'+currentLang]=await translateText(item.title,currentLang);
    }
    if(item.description){
      item['desc_'+currentLang]=await translateText(item.description,currentLang);
    }
  }
  // 카테고리 제목 번역
  for(const cat of allCategories){
    if(cat.title){
      cat['title_'+currentLang]=await translateText(cat.title,currentLang);
    }
  }
}

function updateUIText(){
  const el=id=>document.getElementById(id);
  if(el('txt-checklist-title'))el('txt-checklist-title').textContent=t('checklist');
  if(el('txt-checklist-sub'))el('txt-checklist-sub').textContent=t('checklistSub');
  if(el('txt-progress-label'))el('txt-progress-label').textContent=t('progress');
  buildNav();buildDeskTabs();
}

// ── Supabase ──
async function sb(path,opts={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{headers:HDR,...opts});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||res.statusText);}
  if(res.status===204)return null;
  return res.json();
}

function h(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── 번역 ──
async function translateText(text,targetLang){
  if(targetLang==='ko')return text;
  try{
    // 캐시 확인
    const cached=await sb('translation_cache?source_text=eq.'+encodeURIComponent(text)+'&target_lang=eq.'+targetLang+'&select=translated_text');
    if(cached&&cached.length>0)return cached[0].translated_text;

    // Vercel 서버를 통한 번역
    const res=await fetch(PUSH_SERVER+'/api/translate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,targetLang})
    });
    const data=await res.json();
    if(!data.translated)return text;
    const translated=data.translated;

    // 캐시 저장
    await sb('translation_cache',{method:'POST',body:JSON.stringify({source_text:text,target_lang:targetLang,translated_text:translated})}).catch(()=>{});
    return translated;
  }catch(e){return text;}
}

// ── Auth ──
async function doLogin(){
  const user=document.getElementById('inp-user').value.trim();
  const pass=document.getElementById('inp-pass').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!user||!pass){err.textContent='아이디와 비밀번호를 입력하세요.';return;}
  try{
    const hash=await sha256(pass);
    const rows=await sb('handover_users?username=eq.'+encodeURIComponent(user)+'&password_hash=eq.'+hash+'&is_active=eq.true&select=*');
    if(!rows||rows.length===0){err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';return;}
    currentUser=rows[0];
    localStorage.setItem('hu',JSON.stringify(currentUser));
    showApp();
  }catch(e){err.textContent='오류: '+e.message;}
}

function doLogout(){
  closeUserMenu();
  localStorage.removeItem('hu');currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

}
document.addEventListener('click',function(e){

  const ub=document.querySelector('.user-badge');

function getRoleLabel(role){

  if(role==='trainee')return {label:'신입',cls:'trainee'};

// ── Checklist ──
async function loadChecklist(){
  try{
    allCategories=await sb('handover_categories?order=order_index');
    allItems=await sb('handover_items?order=order_index');
    const checks=await sb('handover_checks?select=*');
    const users=await sb('handover_users?select=id,display_name');
    allChecks=(checks||[]).map(c=>({...c,dname:(users||[]).find(u=>u.id===c.user_id)?.display_name||'?'}));
    renderChecklist();
  }catch(e){showToast('로드 실패: '+e.message);}
}

function renderChecklist(){
  const con=document.getElementById('cl-container');
  const role=currentUser?.role;

  // trainee는 교육자료만, 나머지는 모두 표시
  const visibleCats=allCategories.filter(c=>role==='trainee'?c.type==='education':true);
  const handoverItems=allItems.filter(i=>{
    const cat=allCategories.find(c=>c.id===i.category_id);
    return cat&&cat.type==='handover';
  });

  const myChecks=allChecks.filter(c=>c.user_id===currentUser.id);
  const myIds=new Set(myChecks.map(c=>c.item_id));
  const total=handoverItems.length;
  const done=handoverItems.filter(i=>myIds.has(i.id)).length;

  if(role!=='trainee'){
    document.getElementById('prog-txt').textContent=done+' / '+total+' '+t('done');
    document.getElementById('prog-bar').style.width=total?Math.round(done/total*100)+'%':'0%';
  }else{
    document.getElementById('prog-wrap')&&(document.querySelector('.prog-wrap').style.display='none');
  }

  if(!visibleCats.length){
    con.innerHTML='<div class="empty"><div class="em">📋</div><p>항목을 추가하면 여기에 표시됩니다</p></div>';
    return;
  }

  let html='';
  visibleCats.forEach(function(cat){
    const items=allItems.filter(i=>i.category_id===cat.id);
    if(!items.length)return;
    const isEdu=cat.type==='education';
    const catDone=isEdu?null:items.filter(i=>myIds.has(i.id)).length;
    const catTitle=cat['title_'+currentLang]||cat.title;
    html+='<div class="cat-block">';
    html+='<div class="cat-hdr" onclick="toggleCat(\''+cat.id+'\')">';
    html+='<div class="cat-title"><span>'+h(catTitle)+'</span>';
    if(isEdu)html+='<span class="cat-type-badge education">📚 교육</span>';
    else html+='<span class="cat-count">'+catDone+'/'+items.length+'</span>';
    html+='</div>';
    html+='<span class="cat-chev open" id="chev-'+cat.id+'">▼</span></div>';
    html+='<div class="cat-items" id="ci-'+cat.id+'">';
    items.forEach(function(item){
      if(isEdu){
        const itemTitle=item['title_'+currentLang]||item.title;
        const itemDesc=item['desc_'+currentLang]||item.description;
        html+='<div class="cl-item" data-id="'+item.id+'" data-edu="1" data-title="'+h(item.title)+'">';
        html+='<div class="edu-icon">📖</div>';
        html+='<div class="item-con"><div class="item-ttl">'+h(itemTitle)+'</div>';
        if(itemDesc)html+='<div class="item-dsc">'+h(itemDesc)+'</div>';
        html+='</div><div class="item-arrow">›</div></div>';
      }else{
        const itemTitle=item['title_'+currentLang]||item.title;
        const itemDesc=item['desc_'+currentLang]||item.description;
        const myChk=myChecks.find(c=>c.item_id===item.id);
        const checked=!!myChk;
        const others=allChecks.filter(c=>c.item_id===item.id&&c.user_id!==currentUser.id);
        const othTxt=others.map(c=>c.dname).join(', ');
        html+='<div class="cl-item'+(checked?' checked':'')+'" data-id="'+item.id+'" data-title="'+h(item.title)+'">';
        html+='<div class="chk-box">'+(checked?'✓':'')+'</div>';
        html+='<div class="item-con"><div class="item-ttl">'+h(itemTitle)+'</div>';
        if(itemDesc)html+='<div class="item-dsc">'+h(itemDesc)+'</div>';
        if(myChk&&myChk.note)html+='<div class="item-nt">💬 '+h(myChk.note)+'</div>';
        if(checked)html+='<div class="item-mt">✅ 내가 완료 · '+new Date(myChk.checked_at).toLocaleDateString('ko-KR')+'</div>';
        if(othTxt)html+='<div class="item-mt" style="color:var(--accent)">👤 '+h(othTxt)+'도 완료</div>';
        html+='</div></div>';
      }
    });
    html+='</div></div>';
  });
  con.innerHTML=html||'<div class="empty"><div class="em">📋</div><p>항목이 없습니다</p></div>';

  con.onclick=function(e){
    const el=e.target.closest('.cl-item');
    if(!el)return;
    e.stopPropagation();
    const id=el.getAttribute('data-id');
    const title=el.getAttribute('data-title');
    const isEdu=el.getAttribute('data-edu')==='1';
    if(!id)return;
    if(isEdu)openEduModal(id,title);
    else clickItem(id,title);
  };
}

async function openEduModal(itemId,itemTitle){
  const modal=document.getElementById('edu-modal');
  const titleEl=document.getElementById('edu-modal-title');
  const bodyEl=document.getElementById('edu-modal-body');

  let displayTitle=itemTitle;
  if(currentLang!=='ko'){
    displayTitle=await translateText(itemTitle,currentLang);
  }
  titleEl.textContent='📖 '+displayTitle;
  bodyEl.innerHTML='<div class="lang-loading">'+t('translating')+'</div>';
  modal.classList.add('open');

  try{
    const contents=await sb('education_contents?item_id=eq.'+itemId+'&order=order_index');
    if(!contents||contents.length===0){
      bodyEl.innerHTML='<div class="empty">등록된 교육 내용이 없습니다</div>';return;
    }

    let html='';
    for(const c of contents){
      if(c.content){
        let text=c.content;
        if(currentLang!=='ko')text=await translateText(c.content,currentLang);
        html+='<div class="edu-modal-body">'+h(text)+'</div>';
      }
      if(c.image_url){
        html+='<img class="edu-img" src="'+h(c.image_url)+'" alt="교육 이미지" onerror="this.style.display=\'none\'">';
      }
      if(c.video_url){
        const videoId=getYoutubeId(c.video_url);
        if(videoId){
          html+='<iframe class="edu-video" src="https://www.youtube.com/embed/'+videoId+'" allowfullscreen></iframe>';
        }else{
          html+='<a href="'+h(c.video_url)+'" target="_blank" style="color:var(--accent);font-size:13px;">🎥 동영상 보기</a>';
        }
      }
    }
    bodyEl.innerHTML=html;
  }catch(e){bodyEl.innerHTML='<div class="empty">로드 실패: '+e.message+'</div>';}
}

function getYoutubeId(url){
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
  return m?m[1]:null;
}

// ── Push ──
async function registerPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){showToast('이 브라우저는 알림을 지원하지 않습니다');return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){showToast('알림 권한이 거부되었습니다');return;}
    const reg=await navigator.serviceWorker.register('/handover/sw.js');
    await navigator.serviceWorker.ready;
    const res=await fetch(PUSH_SERVER+'/api/vapid-public-key');
    const {publicKey}=await res.json();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
    await sb('push_subscriptions',{method:'POST',body:JSON.stringify({user_id:currentUser.id,subscription:sub})});
    showToast('알림이 설정되었습니다 🔔');
  }catch(e){showToast('알림 설정 실패: '+e.message);}
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=window.atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

async function sendPushToAll(title,body){
  try{await fetch(PUSH_SERVER+'/api/send-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body,excludeUserId:currentUser.id})});}
  catch(e){console.log('푸시 오류:',e);}
}

// ── 재고관리 ──
// Google Sheets 연동: 시트 데이터를 우선 사용, 실패시 fallback INV_DATA 사용
// Sheets URL 설정: 아래 SHEET_ID에 본인 Google Sheet ID를 입력하세요
const SHEETS_CONFIG = {
  SHEET_ID: 'YOUR_GOOGLE_SHEET_ID',   // ← Google Sheet ID 입력
  SHEET_NAMES: { food:'음식', supply:'비품', drink:'음료' },
  // 열 순서: A=type, B=cat, C=name, D=supplier, E=unit, F=minWd, G=minFr, H=platform
  COL: { type:0, cat:1, name:2, supplier:3, unit:4, minWd:5, minFr:6, platform:7 }
};

let INV_DATA_LOADED = false; // Sheets에서 성공적으로 로드됐는지 여부

async function loadInvFromSheets(){
  const {SHEET_ID, SHEET_NAMES, COL} = SHEETS_CONFIG;
  if(SHEET_ID === 'YOUR_GOOGLE_SHEET_ID'){
    console.log('[재고] Google Sheet ID 미설정 → 기본 데이터 사용');
    return false;
  }
  try{
    const results = {};
    for(const [key, sheetName] of Object.entries(SHEET_NAMES)){
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      const res = await fetch(url, {cache:'no-cache'});
      if(!res.ok) throw new Error(`Sheet fetch 실패: ${sheetName}`);
      const text = await res.text();
      // Google의 응답은 /*O_o*/ ... 형태로 래핑됨
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
      const rows = json.table.rows;
      results[key] = rows
        .filter(r => r.c && r.c[COL.name] && r.c[COL.name].v) // name 비어있는 행 제외
        .map(r => ({
          cat:      (r.c[COL.cat]?.v  || '').toString().trim(),
          name:     (r.c[COL.name]?.v || '').toString().trim(),
          supplier: (r.c[COL.supplier]?.v || '').toString().trim(),
          unit:     (r.c[COL.unit]?.v || '').toString().trim(),
          minWd:    (r.c[COL.minWd]?.v ?? '').toString().trim(),
          minFr:    (r.c[COL.minFr]?.v ?? '').toString().trim(),
          platform: (r.c[COL.platform]?.v || 'direct').toString().trim(),
        }));
    }
    // INV_DATA 덮어쓰기
    INV_DATA.food    = results.food    || INV_DATA.food;
    INV_DATA.supply  = results.supply  || INV_DATA.supply;
    INV_DATA.drink   = results.drink   || INV_DATA.drink;
    INV_DATA_LOADED = true;
    console.log(`[재고] Sheets 로드 완료 — 음식:${INV_DATA.food.length} 비품:${INV_DATA.supply.length} 음료:${INV_DATA.drink.length}`);
    // Sheets 뱃지 표시
    const badge = document.getElementById('inv-sheet-badge');
    if(badge) badge.style.display = 'inline';
    return true;
  } catch(e){
    console.warn('[재고] Sheets 로드 실패, 기본 데이터 사용:', e.message);
    return false;
  }
}

// ── 재고/발주 상태 (세션 메모리)
// invStocks[key] = { stock: 현재재고량(문자열), order: 발주량(문자열) }
let invStocks = {};
let invFilter_current = 'all';

function invKey(type, name){ return type + '::' + name; }
function invGet(type, name){ return invStocks[invKey(type,name)] || {stock:'', order:''}; }
function invSet(type, name, field, val){
  const k = invKey(type, name);
  if(!invStocks[k]) invStocks[k] = {stock:'', order:''};
  invStocks[k][field] = val;
  invUpdateStatus(type, name);
  invUpdateLowCount();
}

function invIsLow(item, stockVal){
  // 수치형 minWd만 비교 (문자형 "□", "1~2" 등은 비교 안 함)
  const isWd = new Date().getDay() >= 1 && new Date().getDay() <= 4;
  const min = isWd ? item.minWd : (item.minFr || item.minWd);
  const minNum = parseFloat(min);
  if(isNaN(minNum)) return false; // 비교 불가
  const stockNum = parseFloat(stockVal);
  if(isNaN(stockNum)) return false; // 미입력
  return stockNum < minNum;
}

function invUpdateStatus(type, name){
  const allItems3 = getAllInvItems();
  const item = allItems3.find(x=>x.type===type && x.name===name);
  if(!item) return;
  const {stock} = invGet(type, name);
  const isLow = stock !== '' && invIsLow(item, stock);
  // 재고 입력 칸 색상
  const stockEl = document.getElementById('inv-stock-' + invSafeId(type, name));
  if(stockEl){ stockEl.classList.remove('low','ok'); if(stock!=='') stockEl.classList.add(isLow?'low':'ok'); }
  // 발주량 칸 하이라이트
  const orderEl = document.getElementById('inv-order-' + invSafeId(type, name));
  if(orderEl){ orderEl.style.background = isLow ? 'rgba(220,38,38,.07)' : ''; }
}

function invUpdateLowCount(){
  const allItems3 = getAllInvItems();
  let low = 0;
  for(const item of allItems3){
    const {stock} = invGet(item.type, item.name);
    if(stock !== '' && invIsLow(item, stock)) low++;
  }
  const el = document.getElementById('inv-low-count');
  if(el) el.textContent = low;
}

function getAllInvItems(){
  return [
    ...INV_DATA.food.map(x=>({...x,type:'food'})),
    ...INV_DATA.supply.map(x=>({...x,type:'supply'})),
    ...INV_DATA.drink.map(x=>({...x,type:'drink'}))
  ];
}

function invSafeId(type, name){
  return btoa(unescape(encodeURIComponent(type+'::'+name))).replace(/[^a-z0-9]/gi,'').slice(0,20);
}

function invFilter(f){
  invFilter_current = f;
  document.querySelectorAll('.inv-filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderInventory();
}

function invReset(){
  if(!confirm('재고 및 발주량 입력을 모두 초기화하시겠습니까?')) return;
  invStocks = {};
  renderInventory();
  showToast('초기화되었습니다');
}

let _invSheetsTried = false; // 탭 전환마다 중복 fetch 방지

async function initInventory(){
  const con = document.getElementById('inv-container');
  if(!con) return;
  if(!_invSheetsTried){
    _invSheetsTried = true;
    // 로딩 표시
    con.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text2);font-size:13px;">📡 품목 데이터 불러오는 중…</div>';
    const ok = await loadInvFromSheets();
    if(ok) showToast('✅ 최신 품목 데이터 로드됨');
  }
  renderInventory();
}

// 재고 탭에서 수동 새로고침 버튼용
async function invRefreshSheets(){
  _invSheetsTried = false;
  await initInventory();
}

function renderInventory(){
  const con = document.getElementById('inv-container');
  if(!con) return;
  const isWd = new Date().getDay() >= 1 && new Date().getDay() <= 4;
  const f = invFilter_current;

  const sections = [
    {key:'food', label:'식재료', emoji:'🍕'},
    {key:'supply', label:'비품·소모품', emoji:'🧴'},
    {key:'drink', label:'주류·음료', emoji:'🍺'}
  ];

  let html = '';

  for(const sec of sections){
    if(f !== 'all' && f !== sec.key && f !== 'low') continue;
    const items = INV_DATA[sec.key];
    const cats = [...new Set(items.map(x=>x.cat))];
    let secHtml = '';

    for(const cat of cats){
      const catItems = items.filter(x=>x.cat===cat);
      let catHtml = '';
      for(const item of catItems){
        const {stock, order} = invGet(sec.key, item.name);
        const isLow = stock !== '' && invIsLow(item, stock);
        if(f === 'low' && (!isLow)) continue;

        const sid = invSafeId(sec.key, item.name);
        const stockCls = stock==='' ? '' : (isLow ? 'low' : 'ok');
        const orderBg = isLow ? 'rgba(220,38,38,.07)' : '';

        const pLabel = {coupang:'쿠팡', foodpang:'푸드팡', direct:'직접발주'}[item.platform]||'';
        const pCls = item.platform;

        // 기준 수량 표시
        let minHtml = '';
        if(item.minWd || item.minFr){
          const wdStr = item.minWd ? item.minWd+(item.unit?' '+item.unit:'') : '-';
          const frStr = item.minFr ? item.minFr+(item.unit?' '+item.unit:'') : '-';
          if(item.minFr && item.minFr !== item.minWd){
            minHtml = `<div class="inv-ref-row">
              <span class="inv-ref-lbl">평일</span><span class="inv-ref-val">${h(wdStr)}</span>
              <span class="inv-ref-sep">│</span>
              <span class="inv-ref-lbl">금요일</span><span class="inv-ref-val inv-ref-fri">${h(frStr)}</span>
            </div>`;
          } else if(item.minWd) {
            minHtml = `<div class="inv-ref-row"><span class="inv-ref-lbl">기준</span><span class="inv-ref-val">${h(wdStr)}</span></div>`;
          }
        }

        const nameEsc = item.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

        catHtml += `<div class="inv-row${isLow?' inv-row-low':''}">
          <div class="inv-name">
            <div class="inv-name-main">${h(item.name)}${item.supplier?'<span class="inv-supplier"> / '+h(item.supplier)+'</span>':''}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;">
              <span class="inv-order-badge ${pCls}">${pLabel}</span>
              ${minHtml}
            </div>
          </div>
          <div class="inv-inputs">
            <div class="inv-input-group">
              <label class="inv-input-lbl">현재재고</label>
              <div class="inv-input-row">
                <input type="text" id="inv-stock-${sid}" class="inv-qty-inp ${stockCls}" placeholder="-"
                  value="${h(stock)}" inputmode="decimal"
                  onchange="invSet('${sec.key}','${nameEsc}','stock',this.value.trim())"
                  oninput="invSet('${sec.key}','${nameEsc}','stock',this.value.trim())">
                <span class="inv-unit">${h(item.unit||'')}</span>
              </div>
            </div>
            <div class="inv-input-group">
              <label class="inv-input-lbl" style="color:var(--red)">발주량</label>
              <div class="inv-input-row">
                <input type="text" id="inv-order-${sid}" class="inv-qty-inp" placeholder="-"
                  style="background:${orderBg}" value="${h(order)}" inputmode="decimal"
                  onchange="invSet('${sec.key}','${nameEsc}','order',this.value.trim())"
                  oninput="invSet('${sec.key}','${nameEsc}','order',this.value.trim())">
                <span class="inv-unit">${h(item.unit||'')}</span>
              </div>
            </div>
          </div>
        </div>`;
      }
      if(!catHtml) continue;
      secHtml += `<div class="inv-cat-hdr">${h(cat)}</div>${catHtml}`;
    }

    if(!secHtml) continue;

    // 오늘 기준 표시
    const todayLabel = isWd ? '📅 오늘은 평일 — 평일 기준 적용' : '📅 오늘은 금/주말 — 금요일 기준 적용';

    html += `<div class="inv-section">
      <div class="inv-section-hdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <div class="inv-section-title">${sec.emoji} ${sec.label}</div>
        <span style="font-size:11px;color:var(--text3);">▼</span>
      </div>
      <div class="inv-section-body">
        <div class="inv-today-label">${todayLabel}</div>
        ${secHtml}
      </div>
    </div>`;
  }

  if(!html) html = '<div class="empty"><div class="em">📦</div><p>표시할 항목이 없습니다</p></div>';
  con.innerHTML = html;
  invUpdateLowCount();
}

function invShowSummary(){
  const isWd = new Date().getDay() >= 1 && new Date().getDay() <= 4;
  const allItems3 = getAllInvItems();

  // 발주량이 입력된 항목 우선, 없으면 재고 부족 항목
  const groups = {coupang:[], foodpang:[], direct:[]};

  for(const item of allItems3){
    const {stock, order} = invGet(item.type, item.name);
    const hasOrder = order !== '';
    const isLow = stock !== '' && invIsLow(item, stock);
    if(!hasOrder && !isLow) continue;

    const min = isWd ? item.minWd : (item.minFr || item.minWd);
    const minNum = parseFloat(min);
    const stockNum = parseFloat(stock);
    let autoNeed = '';
    if(!isNaN(minNum) && !isNaN(stockNum)) autoNeed = String(Math.max(0, Math.ceil(minNum - stockNum)));

    groups[item.platform||'direct'].push({
      ...item,
      stock: stock || '-',
      order: order || (isLow ? autoNeed : ''),
      isLow,
      hasOrder
    });
  }

  const platformNames = {coupang:'🛒 쿠팡 발주', foodpang:'📱 푸드팡 발주 (아이폰)', direct:'📞 직접 발주 / 카톡·메일'};
  let html = '';
  let hasAny = false;
  for(const [plat, items] of Object.entries(groups)){
    if(!items.length) continue;
    hasAny = true;
    html += `<div class="inv-summary-group">
      <div class="inv-summary-group-title">${platformNames[plat]}</div>`;
    for(const item of items){
      const orderTxt = item.order ? item.order+(item.unit?' '+item.unit:'') : '수량 미입력';
      const stockTxt = item.stock !== '-' ? item.stock+(item.unit?' '+item.unit:'') : '-';
      html += `<div class="inv-summary-item">
        <span>${h(item.name)}${item.supplier?' <span style="opacity:.55;font-size:10px;">'+h(item.supplier)+'</span>':''}</span>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700">${h(orderTxt)}</div>
          <div class="inv-summary-count">재고 ${h(stockTxt)}</div>
        </div>
      </div>`;
    }
    html += '</div>';
  }

  if(!hasAny){
    html = '<div class="inv-summary-empty">재고를 입력하거나<br>발주량을 직접 적어주세요</div>';
  }

  const dateStr = new Date().toLocaleDateString('ko-KR');
  const body = document.getElementById('inv-summary-body');
  body.innerHTML = `<div class="inv-summary-card">
    <div class="inv-summary-title">📋 발주 목록 · ${dateStr} (${isWd?'평일':'금/주말'})</div>
    ${html}
  </div>`;
  document.getElementById('inv-summary-modal').classList.add('open');
}

function closeInvModal(){
  document.getElementById('inv-summary-modal').classList.remove('open');
}

function invCopySummary(){
  const isWd = new Date().getDay() >= 1 && new Date().getDay() <= 4;
  const allItems3 = getAllInvItems();
  const groups = {coupang:[], foodpang:[], direct:[]};

  for(const item of allItems3){
    const {stock, order} = invGet(item.type, item.name);
    const hasOrder = order !== '';
    const isLow = stock !== '' && invIsLow(item, stock);
    if(!hasOrder && !isLow) continue;
    const min = isWd ? item.minWd : (item.minFr || item.minWd);
    const minNum = parseFloat(min);
    const stockNum = parseFloat(stock);
    let autoNeed = '';
    if(!isNaN(minNum) && !isNaN(stockNum)) autoNeed = String(Math.max(0, Math.ceil(minNum - stockNum)));
    groups[item.platform||'direct'].push({...item, stock, order: order||(isLow?autoNeed:'')});
  }

  const platformNames = {coupang:'[쿠팡 발주]', foodpang:'[푸드팡 발주]', direct:'[직접발주/카톡·메일]'};
  let text = `📦 발주 목록 (${new Date().toLocaleDateString('ko-KR')} ${isWd?'평일':'금/주말'})\n\n`;
  let hasAny = false;
  for(const [plat, items] of Object.entries(groups)){
    if(!items.length) continue;
    hasAny = true;
    text += platformNames[plat] + '\n';
    for(const item of items){
      const orderTxt = item.order ? item.order+(item.unit?' '+item.unit:'') : '수량확인필요';
      text += `• ${item.name}${item.supplier?' ('+item.supplier+')':''} → ${orderTxt}\n`;
    }
    text += '\n';
  }
  if(!hasAny) text = '발주 항목이 없습니다';
  navigator.clipboard.writeText(text).then(()=>showToast('클립보드에 복사됨 📋')).catch(()=>showToast('복사 실패'));
}

// ── Toast ──
function showToast(msg){
  const t2=document.getElementById('toast');
  t2.textContent=msg;t2.classList.add('show');
  setTimeout(function(){t2.classList.remove('show');},2800);
}

document.getElementById('inp-user').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
const saved=localStorage.getItem('hu');
if(saved){try{currentUser=JSON.parse(saved);showApp();}catch(e){}}
